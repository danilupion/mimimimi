# Server service values
replicaCount: 1
image:
  repository: mimimimi/web
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080

# Ingress values
ingress:
  enabled: true
  ingressClassName: nginx
  annotations: []
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/rewrite-target: /
  host: mimimimi-web.local

# Gateway API HTTPRoute - successor to the Ingress (same routing, declared
# in the chart). ingress and route are independent during a migration window.
route:
  enabled: false
  # Gateway(s) to attach to, e.g.:
  #   - name: gateway-public
  #     namespace: gateway-public
  parentRefs: []
  hostnames: []
  annotations: {}
